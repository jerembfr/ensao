<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12ème compagnie – ENSOA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{
  --bg:#f1ede0; --surface:#e4dec9; --ink:#1c2016; --muted:#555b47; --olive:#3b4a2b; --brass:#8f6d1f; --line:#c9c2a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#151a10; --surface:#1f261a; --ink:#ece7d4; --muted:#a9ae98; --olive:#8aa36a; --brass:#d0a94a; --line:#38412c; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#151a10; --surface:#1f261a; --ink:#ece7d4; --muted:#a9ae98; --olive:#8aa36a; --brass:#d0a94a; --line:#38412c; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:1.0625rem;line-height:1.65}
header{background:var(--olive);color:#f1ede0;padding:clamp(2.5rem,8vw,5rem) 1.25rem clamp(2rem,6vw,3.5rem);border-bottom:6px solid var(--brass)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#26301c;color:#ece7d4}}
:root[data-theme="dark"] header{background:#26301c;color:#ece7d4}
.wrap{max-width:60rem;margin:0 auto}
header h1{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;font-size:clamp(3.2rem,13vw,7.5rem);line-height:.92;margin:0;letter-spacing:.01em}
header p{margin:1rem 0 0;font-size:1.15rem;max-width:34rem;opacity:.92}
main{padding:2.25rem 1.25rem 3rem}
h2{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;font-size:1.7rem;margin:0 0 .25rem}
.sub{color:var(--muted);margin:0 0 1.25rem}
.player{aspect-ratio:16/9;width:100%;background:#0e100b;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.empty{text-align:center;padding:1.5rem;color:#d9d4bf;max-width:26rem}
.empty strong{display:block;font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.5rem;font-weight:600;margin-bottom:.4rem}
.btn{display:inline-block;margin-top:.9rem;padding:.6rem 1.1rem;background:var(--brass);color:#14170f;font:600 1rem/1 "Barlow Condensed",Arial,sans-serif;border:0;cursor:pointer}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=file]{display:none}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem;margin-top:1rem}
.actions .btn{margin-top:0;background:var(--olive);color:#f1ede0}
.actions .btn:disabled{opacity:.45;cursor:not-allowed}
#msg{color:var(--muted);font-size:.95rem}
footer{border-top:1px solid var(--line);padding:1.25rem;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>12ème compagnie</h1>
  <p>École Nationale des Sous-Officiers d’Active – Saint-Maixent-l’École</p>
</div></header>

<main><div class="wrap">
  <h2>La vidéo de la compagnie</h2>
  <p class="sub">Durée : 11 minutes</p>
  <div class="player" id="player">
    <div class="empty">
      <strong>La vidéo arrive bientôt</strong>
      Elle sera diffusée ici dès qu’elle sera ajoutée à la page.
      <br><label class="btn" for="f" tabindex="0">Tester avec un fichier</label>
      <input type="file" id="f" accept="video/*">
    </div>
  </div>
  <div class="actions"><button class="btn" id="dl" type="button" disabled>Télécharger la vidéo</button><span id="msg" role="status"></span></div>
</div></main>

<footer><div class="wrap">12ème compagnie – ENSOA</div></footer>

<script>
// Colle ici le lien de ta vidéo (YouTube, Vimeo ou fichier .mp4), entre les guillemets.
var VIDEO_URL = "";

var box = document.getElementById("player");
var current = null, dl = document.getElementById("dl"), msg = document.getElementById("msg");
function show(url){
  var m, el;
  current = url; dl.disabled = false; msg.textContent = "";
  if ((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/))) {
    el = document.createElement("iframe");
    el.src = "https://www.youtube-nocookie.com/embed/" + m[1];
    el.allow = "fullscreen; picture-in-picture";
    el.allowFullscreen = true;
  } else if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) {
    el = document.createElement("iframe");
    el.src = "https://player.vimeo.com/video/" + m[1];
    el.allow = "fullscreen; picture-in-picture";
    el.allowFullscreen = true;
  } else {
    el = document.createElement("video");
    el.src = url; el.controls = true; el.playsInline = true;
  }
  el.title = "Vidéo de la 12ème compagnie";
  box.replaceChildren(el);
}
if (VIDEO_URL) show(VIDEO_URL);
dl.addEventListener("click", async function(){
  if (!current) return;
  if (/youtu|vimeo/.test(current)) { msg.textContent = "Ce lien ne permet pas le téléchargement. Il faut un fichier vidéo (.mp4)."; return; }
  var dls = window.claude ? await claude.use("downloads") : null;
  if (!dls) { msg.textContent = "Téléchargement indisponible ici."; return; }
  try {
    dl.disabled = true; msg.textContent = "Préparation…";
    var blob = await (await fetch(current)).blob();
    var ext = (current.match(/\.(mp4|webm|mov)(\?|$)/i) || [, "mp4"])[1].toLowerCase();
    await dls.save({ filename: "12eme-compagnie-ensoa." + ext, data: blob });
    msg.textContent = "";
  } catch (e) {
    msg.textContent = (e && e.code === "declined") ? "" : "Le téléchargement a échoué.";
  } finally { dl.disabled = false; }
});
document.getElementById("f").addEventListener("change", function(e){
  var file = e.target.files[0];
  if (file) show(URL.createObjectURL(file));
});
document.querySelector("label.btn").addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("f").click(); }
});
</script>
</body>
</html>
